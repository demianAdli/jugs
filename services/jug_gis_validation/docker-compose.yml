services:
  jug_gis_validation:
    image: demianadli/jug_gis_validation:0.1.0
    build:
      context: ../..
      dockerfile: services/jug_gis_validation/docker/Dockerfile
      args:
        INSTALL_LOCAL: ${INSTALL_LOCAL:-true}
        JUG_GIS_VALIDATION_VERSION: ${JUG_GIS_VALIDATION_VERSION:-latest}
        SABU_CHASSIS_VERSION: ${SABU_CHASSIS_VERSION:-latest}
    container_name: jug_gis_validation
    ports:
      - "8082:5000"
    environment:
      LOG_DIR_BASE: /app
      LOG_FILE_NAME: logs/jug_gis_validation.log
      LOG_SERVICE: gis_validation-api
    volumes:
      - ./logs:/app/logs
      # Mount host GIS folders here when using buildings_set_path in the API.
      # Example API path after mounting: /data/gis/QuebecCity.geojson
      - ${JUG_GIS_VALIDATION_DATA_DIR:-./input_files}:/data/gis:ro
    restart: unless-stopped
